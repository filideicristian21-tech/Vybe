<title>Vybe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#0e0e13;--muted:#8b8b97;--line:#ececf1;--soft:#f4f4f7;--vy:linear-gradient(135deg,#7c3aed 0%,#ec4899 55%,#f97316 100%);--red:#ff2d55}
html,body{height:100%;background:#e8e8ee;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);overscroll-behavior:none}
#app{position:relative;max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:#fff;overflow:hidden}
@media(min-width:520px){#app{height:min(100dvh,900px);top:max(0px,calc((100dvh - 900px)/2));border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.18)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.ic{display:block;flex:none}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;flex:none}
.iconbtn:active{background:var(--soft)}
.dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.logo{font-family:'Dancing Script',cursive;font-weight:700;font-size:34px;letter-spacing:.5px;position:relative;line-height:1}
.logo::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--vy);top:2px;right:-9px}

/* SPLASH */
#splash{align-items:center;justify-content:center;background:#03010a;z-index:90;overflow:hidden}
.splash-logo{font-family:'Dancing Script',cursive;font-weight:700;font-size:82px;color:#fff;opacity:0;animation:warpin 1.1s 1.2s cubic-bezier(.2,.9,.3,1) forwards;position:relative;z-index:2;text-shadow:0 0 24px rgba(236,72,153,.7),0 0 70px rgba(124,58,237,.6)}
.splash-logo::after{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:var(--vy);top:8px;right:-16px}
.splash-tag{color:rgba(255,255,255,.62);font-size:13px;margin-top:8px;opacity:0;animation:fade .8s 1.9s forwards;position:relative;z-index:2;letter-spacing:.08em}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}

/* AUTH */
#auth{overflow-y:auto;background:#fff}
.auth-top{display:flex;align-items:center;gap:12px;padding:14px 14px 6px;position:sticky;top:0;background:#fff;z-index:2}
.prog{flex:1;height:5px;background:var(--soft);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--vy);border-radius:5px;transition:width .5s}
.pnum{font-size:12px;color:var(--muted);font-weight:700;width:30px;text-align:right}
.auth-body{padding:16px 22px 34px;display:flex;flex-direction:column;gap:14px;flex:1;animation:slidein .35s ease}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.auth h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--muted);font-size:14.5px;line-height:1.45;margin-top:-4px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600}
.in{height:52px;border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:0 16px;font-size:16px;outline:none;width:100%;transition:border-color .2s,background .2s}
.in:focus{border-color:var(--acc);background:#fff}
.in.bad{border-color:#ef4444}.in.good{border-color:#22c55e}
.at{position:relative}.at>b{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}.at .in{padding-left:34px}
.pw{position:relative}.pw .in{padding-right:50px}.pw button{position:absolute;right:6px;top:6px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);min-height:16px;line-height:1.35}.hint.ok{color:#16a34a}.hint.err{color:#dc2626}
.btn{height:54px;border-radius:16px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;width:100%;transition:opacity .2s,transform .1s;flex:none}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.28;pointer-events:none}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.vy{background:var(--vy)}
.btn.red{background:#ef4444}
.link{color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}
.spacer{flex:1}
.reqs{list-style:none;display:grid;gap:7px;font-size:13.5px}
.reqs li{display:flex;align-items:center;gap:9px;color:var(--muted);transition:color .2s}
.reqs li i{width:18px;height:18px;border-radius:50%;border:1.6px solid #cfcfd8;display:grid;place-items:center;flex:none;transition:.2s}
.reqs li.ok{color:var(--ink)}.reqs li.ok i{background:#22c55e;border-color:#22c55e}
.reqs li.ok i::after{content:'';width:6px;height:3.5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.meter{display:flex;gap:5px}.meter i{flex:1;height:5px;border-radius:5px;background:var(--soft);transition:background .3s}
.otp{position:relative;display:flex;gap:9px;justify-content:center;margin:6px 0}
.otp span{width:46px;height:58px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:700;transition:.15s}
.otp span.cur{border-color:var(--acc);background:#fff}
.otp input{position:absolute;inset:0;opacity:0;font-size:16px;width:100%}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.row3{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
select.in{appearance:none;-webkit-appearance:none;padding:0 12px;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 16px) 23px,calc(100% - 11px) 23px;background-size:5px 5px;background-repeat:no-repeat}
.box{border-radius:18px;padding:14px 16px;background:var(--soft);font-size:13.5px;line-height:1.5}
.box.teen{background:linear-gradient(135deg,#f3e8ff,#fce7f3);}
.box.warn{background:#fef2f2;color:#991b1b}
.box b{font-weight:700}
.chk{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.8px solid #c9c9d3;flex:none;margin-top:-1px;display:grid;place-items:center;transition:.15s;background:#fff}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:'';width:8px;height:4.5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk input:disabled{opacity:.35}
.chk.dis{color:var(--muted)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hgrid button{aspect-ratio:1;border-radius:20px;background:var(--soft);font-size:30px;font-weight:800;transition:.15s}
.hgrid button.done{background:var(--acc);color:#fff;transform:scale(.94)}
.tbar{height:5px;border-radius:5px;background:var(--soft);overflow:hidden}.tbar i{display:block;height:100%;background:var(--acc);transform-origin:left}
.tbar i.run{animation:tdown 20s linear forwards}
@keyframes tdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.pindots{display:flex;gap:16px;justify-content:center;margin:18px 0 8px}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid #c9c9d3;transition:.15s}
.pindots i.on{background:var(--acc);border-color:var(--acc);transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;justify-content:center;margin-top:8px}
.keypad button{width:76px;height:76px;border-radius:50%;background:var(--soft);font-size:28px;font-weight:600;display:grid;place-items:center}
.keypad button:active{background:#e4e4ea}
.keypad button.nb{background:none}
.terms{height:300px;overflow-y:auto;border:1.5px solid var(--line);border-radius:18px;padding:16px;font-size:13.5px;line-height:1.55;color:#333}
.terms h3{font-size:14.5px;margin:12px 0 4px;color:var(--ink)}.terms h3:first-child{margin-top:0}
.terms .end{margin-top:14px;padding:10px;border-radius:12px;background:var(--soft);text-align:center;font-weight:600}
.scrollnote{font-size:12.5px;color:var(--muted);text-align:center}
.welcome{flex:1;display:flex;flex-direction:column;padding:26px 24px 30px;gap:14px}
.collage{position:relative;height:330px;margin:10px 0 6px}
.collage .badge{position:absolute;z-index:3;background:#fff;border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;align-items:center;gap:6px}
.wtitle{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.wtitle em{font-style:normal;background:var(--vy);-webkit-background-clip:text;background-clip:text;color:transparent}
.donec{width:110px;height:110px;border-radius:50%;background:var(--vy);display:grid;place-items:center;color:#fff;margin:40px auto 10px;animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both;transform:scale(.5);opacity:0}
.center{text-align:center}

/* MAIN */
#views{position:absolute;inset:0 0 66px 0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-height:58px}
.hicons{display:flex;gap:2px}
.stories{display:flex;gap:13px;overflow-x:auto;padding:6px 16px 12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{width:68px;flex:none;text-align:center;font-size:11.5px;font-weight:500}
.st .ring{width:68px;height:68px;border-radius:50%;padding:2.5px;background:var(--vy);position:relative}
.st .ring.seen{background:#d6d6de}
.st .ring.none{background:none;padding:0}
.st .ring>.av{border:2.5px solid #fff;width:100%!important;height:100%!important}
.st .nm{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addb{position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;border:2.5px solid #fff;display:grid;place-items:center}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;object-fit:cover;letter-spacing:.02em;overflow:hidden}
.tabs{display:flex;gap:20px;padding:2px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:14px;font-weight:600;color:#a3a3ae;padding:8px 0 10px;position:relative;white-space:nowrap}
.tab.on{color:var(--ink)}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.tab small{font-size:9.5px;background:var(--soft);padding:2px 6px;border-radius:6px;margin-left:4px;color:var(--muted)}
.teenpill{margin:-2px 14px 12px;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:12px;background:linear-gradient(135deg,#f3e8ff,#fce7f3);color:#6b21a8}
.grid{display:flex;gap:10px;padding:0 12px 30px;align-items:flex-start}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.card{border-radius:20px;overflow:hidden;position:relative;background:var(--soft);cursor:pointer}
.card img.ph{display:block;width:100%;height:auto;object-fit:cover;background:linear-gradient(135deg,#ececf2,#dcdce6)}
img.lz{opacity:0;transition:opacity .45s}
img.lz.ld,img.lz[src]{opacity:1}
.chip{position:absolute;top:9px;left:9px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:999px;padding:3px 10px 3px 3px;font-size:11.5px;font-weight:600;max-width:calc(100% - 18px)}
.chip>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardlike{position:absolute;bottom:9px;right:9px;display:flex;align-items:center;gap:4px;color:#fff;font-size:11.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.tcard{padding:13px 14px 12px;display:flex;flex-direction:column;color:#fff}
.tcard .trow{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600}
.tcard .ttxt{font-size:19px;font-weight:700;line-height:1.14;letter-spacing:-.015em;margin:30px 0 4px}
.tcard .tfoot{font-size:10.5px;opacity:.75;margin-top:10px}
.tcard.plain{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tcard.plain .ttxt{font-size:13.5px;font-weight:400;line-height:1.45;margin:10px 0 0;letter-spacing:0;color:#333}
.tcard.plain .tfoot{color:var(--muted);opacity:1}
.adbar{position:absolute;left:0;right:0;bottom:0;padding:30px 11px 11px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.adbar b{font-size:13px;display:block}
.adbar small{font-size:10px;opacity:.85;display:flex;align-items:center;gap:4px}
.adbar .cta{margin-top:8px;display:block;width:100%;background:#fff;color:#111;border-radius:10px;font-size:12px;font-weight:700;padding:7px 0;text-align:center}
.spons{display:inline-block;background:rgba(255,255,255,.22);padding:1px 6px;border-radius:5px;font-weight:700;letter-spacing:.02em}
.vidempty{margin:30px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.vidempty .bigic{width:76px;height:76px;border-radius:24px;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink)}
.loader{height:60px;display:grid;place-items:center;color:var(--muted);font-size:12px}

#nav{position:absolute;left:0;right:0;bottom:0;height:66px;display:flex;align-items:center;justify-content:space-around;background:#fff;border-top:1px solid var(--line);z-index:20;transition:background .25s,border-color .25s;padding-bottom:4px}
#nav button{width:54px;height:50px;display:grid;place-items:center;color:#a9a9b3;position:relative}
#nav button.on{color:var(--ink)}
#nav .plus{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff!important}
#nav.dark{background:#000;border-color:#161616}
#nav.dark button{color:#777}#nav.dark button.on{color:#fff}
#nav.dark .plus{background:#fff;color:#000!important}
#nav .meav{width:26px;height:26px;border-radius:50%;overflow:hidden;outline:2px solid transparent;outline-offset:2px}
#nav button.on .meav{outline-color:currentColor}
.nbadge{position:absolute;top:5px;right:9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}

/* REELS */
#v-reels{background:#000;color:#fff}
.rscroll{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.rscroll::-webkit-scrollbar{display:none}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#0a0a0a}
.reel .dbl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .rtext{position:absolute;inset:0;display:flex;align-items:center;padding:40px 70px 120px 28px;font-size:30px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.rshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 18%,transparent 55%,rgba(0,0,0,.75) 100%);pointer-events:none}
.rinfo{position:absolute;left:16px;right:78px;bottom:18px}
.rauth{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.rauth .fb{border:1.5px solid rgba(255,255,255,.8);border-radius:9px;padding:4px 11px;font-size:12.5px;font-weight:700;color:#fff}
.rauth .fb.on{background:rgba(255,255,255,.18);border-color:transparent}
.rcap{font-size:14px;line-height:1.4;margin-top:9px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.rinfo .adcta{margin-top:12px;width:100%;background:#fff;color:#000;border-radius:12px;padding:12px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.ract{position:absolute;right:10px;bottom:24px;display:flex;flex-direction:column;gap:18px;align-items:center}
.ract button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ract button svg{filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.rtop{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:center;gap:22px;padding:16px 0;font-weight:700;font-size:16px;pointer-events:none}
.rtop button{pointer-events:auto;color:rgba(255,255,255,.6);text-shadow:0 1px 6px rgba(0,0,0,.4)}
.rtop button.on{color:#fff}
.liked svg{fill:var(--red);stroke:var(--red)}
.saved svg{fill:currentColor}
.burst{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;z-index:10;animation:burst .9s ease forwards;color:#fff}
.burst svg{width:100%;height:100%;fill:#fff;stroke:none;filter:drop-shadow(0 6px 20px rgba(255,45,85,.6))}
@keyframes burst{0%{transform:scale(0) rotate(-15deg);opacity:0}15%{transform:scale(1.2) rotate(-8deg);opacity:1}30%{transform:scale(.95)}70%{transform:scale(1);opacity:1}100%{transform:scale(1.3) translateY(-40px);opacity:0}}

/* OVERLAYS */
#layer{position:absolute;inset:0;pointer-events:none;z-index:40}
#layer>*{pointer-events:auto}
.ov{position:absolute;inset:0}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s}
.ov.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;max-height:88%;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.ov.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:#dcdce3;margin:9px auto 4px;flex:none}
.shead{font-weight:700;font-size:16px;text-align:center;padding:6px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.sbody{overflow-y:auto;padding:8px 0 18px;flex:1}
.ovf{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.ovf.open{transform:none}
.ovf,.ov{isolation:isolate}
.ovf.up{transform:translateY(100%)}.ovf.up.open{transform:none}
.ovf.fadein{transform:none;opacity:0;transition:opacity .25s}.ovf.fadein.open{opacity:1}
.fhead{display:flex;align-items:center;gap:6px;padding:8px 8px;min-height:56px;border-bottom:1px solid var(--line);flex:none}
.fhead h2{font-size:16.5px;font-weight:700;flex:1}
.fbody{flex:1;overflow-y:auto}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;font-size:15px;font-weight:500;text-align:left}
.menu button:active{background:var(--soft)}
.menu .mi{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center}
.menu small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
.menu .danger{color:#dc2626}

#toasts{position:absolute;top:12px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(18,18,24,.92);color:#fff;font-size:13px;font-weight:500;padding:8px 14px 8px 8px;border-radius:999px;display:flex;align-items:center;gap:8px;max-width:88%;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .35s cubic-bezier(.2,.9,.3,1.3);backdrop-filter:blur(10px)}
.toast.plain{padding:9px 16px}
.toast>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
#mailbanner{position:absolute;top:10px;left:10px;right:10px;z-index:85;background:rgba(246,246,249,.97);backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;box-shadow:0 14px 40px rgba(0,0,0,.18);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
#mailbanner.show{transform:none}
.mb-ic{width:38px;height:38px;border-radius:10px;background:var(--vy);color:#fff;display:grid;place-items:center;flex:none}
.mb-h{display:flex;justify-content:space-between;font-size:13px}.mb-h span{color:var(--muted);font-size:12px}
.mb-t{font-size:13.5px;line-height:1.35;margin-top:2px}
.mb-t b{letter-spacing:.12em}
.mb-demo{font-size:10.5px;color:var(--muted);margin-top:4px}

/* post detail */
.dtop{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;min-height:58px;flex:none;border-bottom:1px solid var(--line)}
.dauth{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer}
.dauth b{font-size:14px;display:flex;align-items:center;gap:4px}
.dauth small{display:block;color:var(--muted);font-size:12px}
.fbtn{background:var(--acc);color:#fff;border-radius:11px;padding:8px 15px;font-size:13px;font-weight:700;flex:none}
.fbtn.on{background:var(--soft);color:var(--ink)}
.dmedia{position:relative;background:var(--soft)}
.dmedia img{display:block;width:100%}
.dmedia .tbig{padding:28px 24px 34px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;font-size:28px;font-weight:800;line-height:1.12;letter-spacing:-.02em}
.dmedia .tbig.plain{background:#fff;color:#222;font-size:19px;font-weight:500;line-height:1.45;justify-content:center;border-bottom:1px solid var(--line)}
.adline{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#111;color:#fff;font-weight:700;font-size:14px}
.dacts{display:flex;align-items:center;gap:4px;padding:8px 8px 2px}
.dacts button{display:flex;align-items:center;gap:6px;padding:8px;font-weight:600;font-size:14px}
.dcap{padding:4px 16px 2px;font-size:14.5px;line-height:1.45}
.dcap b{font-weight:700;margin-right:5px}
.dmore{padding:6px 16px;color:var(--muted);font-size:14px}
.dtime{padding:2px 16px 24px;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.cmt{display:flex;gap:11px;padding:10px 16px;align-items:flex-start}
.cmt .ct{flex:1;font-size:14px;line-height:1.4}
.cmt .ct b{font-weight:700;margin-right:6px}
.cmt .ct small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.cmt .ch{color:#b5b5be;padding:4px}
.cmt .ch.liked{color:var(--red)}
.cbar{display:flex;align-items:center;gap:10px;padding:10px 12px 14px;border-top:1px solid var(--line);flex:none;background:#fff}
.cbar input{flex:1;height:44px;border-radius:22px;border:1.5px solid var(--line);padding:0 16px;font-size:16px;outline:none;background:var(--soft)}
.cbar input:focus{background:#fff;border-color:#bbb}
.cbar .send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.cwarn{margin:0 12px 6px;font-size:12.5px;color:#b91c1c;background:#fef2f2;border-radius:10px;padding:8px 11px}
.emptyc{text-align:center;color:var(--muted);padding:34px 20px;font-size:14px}

/* story viewer */
.story{position:absolute;inset:0;background:#000;color:#fff;user-select:none;-webkit-user-select:none}
.story .smedia{position:absolute;inset:0;display:grid;place-items:center}
.story .smedia img{width:100%;height:100%;object-fit:cover}
.story .stext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 30px;font-size:30px;font-weight:800;line-height:1.15}
.sbars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.sbars div{flex:1;height:2.6px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.sbars i{display:block;height:100%;background:#fff;width:0}
.shead2{position:absolute;top:22px;left:12px;right:6px;display:flex;align-items:center;gap:9px;z-index:3;font-size:14px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.shead2 small{font-weight:500;opacity:.8}
.shead2 .sp{flex:1}
.stop{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.4),transparent 20%,transparent 80%,rgba(0,0,0,.5));pointer-events:none;z-index:1}
.sfoot{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;gap:10px;align-items:center;z-index:3}
.sfoot input{flex:1;height:46px;border-radius:23px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;padding:0 18px;font-size:16px;outline:none}
.sfoot input::placeholder{color:rgba(255,255,255,.8)}
.sfoot button{color:#fff;width:44px;height:44px;display:grid;place-items:center}
.sviews{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 6px}
.tapz{position:absolute;inset:70px 0 76px 0;z-index:2}

/* compose */
.cpreview{margin:14px;border-radius:20px;overflow:hidden;background:var(--soft)}
.cpreview img{display:block;width:100%;max-height:420px;object-fit:cover}
.ctext{margin:14px;border-radius:22px;min-height:290px;padding:24px;display:flex;align-items:flex-end;font-size:26px;font-weight:800;line-height:1.15;color:#fff;letter-spacing:-.02em;word-break:break-word;transition:background .25s}
.ta{width:calc(100% - 28px);margin:0 14px;min-height:96px;border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;font-size:16px;outline:none;resize:none;background:var(--soft);line-height:1.4}
.ta:focus{background:#fff;border-color:#bbb}
.swatches{display:flex;gap:10px;padding:12px 14px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--acc)}
.cnt{text-align:right;font-size:12px;color:var(--muted);padding:5px 16px}
.pubbtn{background:var(--acc);color:#fff;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px}
.pubbtn:disabled{opacity:.3}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;font-size:14.5px}
.trow2 small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.sw{width:50px;height:30px;border-radius:15px;background:#d9d9e0;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:#22c55e}.sw.on::after{left:23px}
.sw.locked{opacity:.55}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 10px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lockn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#7c3aed;font-weight:600;margin-top:3px}

/* profile */
.ptop{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 18px;min-height:56px;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);z-index:4}
.ptop b{font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px}
.phead{display:flex;align-items:center;gap:20px;padding:8px 18px 12px}
.pav{position:relative;cursor:pointer}
.pav .ring{width:90px;height:90px;border-radius:50%;padding:3px;background:var(--vy)}
.pav .ring.none{background:var(--line)}
.pav .ring>*{width:100%!important;height:100%!important;border:3px solid #fff}

.stats{display:flex;flex:1;justify-content:space-around;text-align:center}

function lg(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>Array.isArray(s)?g.addColorStop(s[0],s[1]):g.addColorStop(i/(st.length-1),s));return g}
function rg(c,x,y,r0,r1,st){const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>Array.isArray(s)?g.addColorStop(s[0],s[1]):g.addColorStop(i/(st.length-1),s));return g}

 c.beginPath();c.moveTo(0,H);p.forEach((v,i)=>c.lineTo(i/(p.length-1)*W,v));c.lineTo(W,H);c.closePath();c.fillStyle=fill;c.fill();return p}

const Persist={db:null,uid:null,ready:false,up:new Set(),
 async init(){try{if(!window.claude||typeof window.claude.use!=='function')return;const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;const uid=await user.id();if(!uid)return;this.db=db;this.uid=uid;this.ready=true}catch(e){}},
 ref(k){return this.db.doc('data/users/'+this.uid+'/'+k)},
 async load(){try{const s=await this.ref('account').get();if(!s.exists)return null;const d=s.data();let acc;try{acc=JSON.parse(d.json)}catch(e){return null}acc.updated=d.updated||acc.updated;
  const fix=async v=>{if(typeof v==='string'&&v[0]==='@'){const k=v.slice(1);try{const im=await this.ref('img_'+k).get();if(im.exists){this.up.add(k);return im.data().d}}catch(e){}return null}return v};
  acc.avatar=await fix(acc.avatar);for(const p of acc.own||[])if(p.img)p.img=await fix(p.img);acc.own=(acc.own||[]).filter(p=>p.type!=='photo'||p.img);
  for(const st of acc.stories||[])if(st.img)st.img=await fix(st.img);acc.stories=(acc.stories||[]).filter(x=>x.img!==null);return acc}catch(e){return undefined}},
 async wipe(){if(!this.ready)return;try{for(const k of this.up)await this.ref('img_'+k).delete();await this.ref('account').delete()}catch(e){}this.up.clear()}};
function stripImgs(acc){const imgs={},c=JSON.parse(JSON.stringify(acc));
 if(c.avatar&&c.avatar.startsWith('data:')){imgs.avatar=c.avatar;c.avatar='@avatar'}
 (c.own||[]).forEach(p=>{if(p.img&&p.img.startsWith('data:')){const k='p_'+p.id;imgs[k]=p.img;p.img='@'+k}});
 (c.stories||[]).forEach(x=>{if(x.img&&x.img.startsWith('data:')){const k='s_'+x.time;imgs[k]=x.img;x.img='@'+k}});return{c,imgs}}

async function flushPersist(){if(!Persist.ready||!S.acc)return;if(pBusy){pDirty=true;return}pBusy=true;pDirty=false;
 try{const{c,imgs}=stripImgs(S.acc);for(const k in imgs){if(!Persist.up.has(k)){try{await Persist.ref('img_'+k).set({d:imgs[k]});Persist.up.add(k)}catch(e){if(e&&e.code==='quota_exceeded')throw e}}}
  await Persist.ref('account').set({json:JSON.stringify(c),updated:S.acc.updated||Date.now()})}
 catch(e){if(e&&e.code==='quota_exceeded'&&!S.qWarn){S.qWarn=1;toast('Spazio online pieno: elimina qualche post')}}
 pBusy=false;if(pDirty)persistSoon()}

 const p=USERS[u],r=mulberry(u*131+(kind==='followers'?7:3)),base=kind==='followers'?p.fol:followingCount(u),n=Math.min(base,80),ids=new Set();let g=0;
 while(ids.size<n&&g++<3000){const id=Math.floor(r()*USERS.length);if(id!==u)ids.add(id)}
 const L=[...ids].map(i=>USERS[i]);let total=base;if(kind==='followers'&&isFollow(u)){L.unshift(ME());total++}return{L,total}}

/* story viewer */
function openStory(start){const list=storyList();if(!list[start])return;let ui=start,fi=0,prog=0,paused=false,raf,last=performance.now(),holdT,held=false,busy=false;const DUR=6000;
 Music.unlock();S.storyOpen=true;
 const ov=openFull(`<div class="story"><div class="sstage" id="stg"><div class="smedia" id="sm"></div><div class="stop"></div><div class="sbars" id="sb"></div><div class="shead2" id="sh"></div><div id="mst"></div></div><div class="tapz" id="tz"></div><div class="sfoot" id="sf"></div></div>`,'fadein');
 const stg=$('#stg',ov);
 function show(){const s=list[ui],f=s.frames[fi];prog=0;
  $('#sb',ov).innerHTML=s.frames.map((_,i)=>`<div><i style="width:${i<fi?100:0}%"></i></div>`).join('');
  const mid=s.mine?(f.music||null):(s.ref?s.ref.music:null),info=trackInfo(mid,f);
  $('#sh',ov).innerHTML=`${avHTML(s.who,34)}<span>${esc(s.mine?'La tua storia':s.who.u)} <small>${ago(f.time||s.time)}</small></span><span class="sp"></span>${info?`<button class="iconbtn" id="smute">${ic(Music.muted?'mute':'vol',22,2)}</button>`:''}${s.mine?`<button class="iconbtn" id="sDel">${ic('trash',22)}</button>`:''}<button class="iconbtn" id="sx">${ic('x',26)}</button>`;
  const m=$('#sm',ov),kb=(ui+fi)%2?'kb2':'';
  if(f.img)m.innerHTML=`<img class="${kb}" src="${f.img}" alt="">`;else if(f.scene)m.innerHTML=`<img class="${kb}" src="${sceneURL(f.scene,f.seed,432,768)}" alt="">`;else m.innerHTML=`<div class="stext" style="--bg:${f.bg}"><div>${words(f.text)}</div></div>`;
  $('#mst',ov).innerHTML=info?`<div class="msticker ${Music.muted?'paused':''}"><span class="mcov" style="background:linear-gradient(135deg,${info.c[0]},${info.c[1]})">${ic('music',15,2)}</span><div><b>${esc(info.title)}</b><span>${esc(info.artist)}</span></div><div class="eq"><i></i><i></i><i></i><i></i></div></div>`:'';
  Music.set(mid);
  const mu=$('#smute',ov);if(mu)mu.onclick=()=>{const v=Music.toggleMute();mu.innerHTML=ic(v?'mute':'vol',22,2);const k=$('.msticker',ov);if(k)k.classList.toggle('paused',v)};
  if(s.mine)$('#sf',ov).innerHTML=`<div class="sviews">${ic('eye',20)} Vista da ${S.acc.storyViews||0} persone</div>`;
  else{$('#sf',ov).innerHTML=`<input id="sr" placeholder="Rispondi a ${esc(s.who.first)}…" maxlength="200"><button id="sl">${ic('heart',28)}</button><button id="ss">${ic('send',26)}</button>`;
   const sr=$('#sr',ov);sr.onfocus=()=>paused=true;sr.onblur=()=>paused=false;
   const sendR=()=>{const v=sr.value.trim();if(!v)return;if(S.acc.settings.filter&&isBad(v)){toast('Messaggio bloccato: sembra offensivo');return}if(S.teen&&!isFollow(s.who.id)){toast('Account Teen: puoi scrivere solo a chi segui');return}addMsg(s.who.id,v,true);sr.value='';sr.blur();toast('Risposta inviata a '+s.who.first,s.who)};
   $('#ss',ov).onclick=sendR;sr.onkeydown=e=>{if(e.key==='Enter')sendR()};$('#sl',ov).onclick=e=>{e.currentTarget.classList.toggle('liked');burst($('.story',ov))}}
  if(s.ref)s.ref.seen=true;
  $('#sx',ov).onclick=()=>closeOv(ov);
  const del=$('#sDel',ov);if(del)del.onclick=()=>{const idx=S.acc.stories.indexOf(f);if(idx>=0)S.acc.stories.splice(idx,1);save();renderStories();toast('Storia eliminata');closeOv(ov)}}
 function go(dir,fn){if(busy)return;busy=true;cube(stg,dir,()=>{fn();show()},()=>{busy=false})}
 function next(){const s=list[ui];if(fi<s.frames.length-1){fi++;show()}else if(ui<list.length-1)go(1,()=>{ui++;fi=0});else closeOv(ov)}
 function prev(){if(fi>0){fi--;show()}else if(ui>0)go(-1,()=>{ui--;fi=0});else prog=0}
 function loop(now){const dt=now-last;last=now;if(!paused&&!held&&!busy){prog+=dt/DUR;if(prog>=1){prog=0;next()}}const bar=$$('#sb i',ov)[fi];if(bar)bar.style.width=Math.min(100,prog*100)+'%';raf=requestAnimationFrame(loop)}
 const tz=$('#tz',ov);tz.onpointerdown=()=>{holdT=setTimeout(()=>held=true,220)};
 tz.onpointerup=e=>{clearTimeout(holdT);if(held){held=false;return}const r=tz.getBoundingClientRect();if(e.clientX-r.left<r.width*.3)prev();else next()};
 tz.onpointerleave=()=>{clearTimeout(holdT);held=false};
 ov.onclose=()=>{cancelAnimationFrame(raf);S.storyOpen=false;Music.stop();if(S.actReel)S.actReel.classList.remove('act');S.actReel=null;renderStories();if(S.view==='reels')reelFx()};show();raf=requestAnimationFrame(loop)}

/* create */
function pickImage(max=900){return new Promise(res=>{const inp=$('#filePick');inp.value='';inp.onchange=()=>{const f=inp.files[0];if(!f)return res(null);if(!f.type.startsWith('image/')){toast('Seleziona una foto');return res(null)}
 const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{let m=max,q=.74,url,w,h;for(let k=0;k<6;k++){const sc=Math.min(1,m/Math.max(im.width,im.height));w=Math.round(im.width*sc);h=Math.round(im.height*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);url=c.toDataURL('image/jpeg',q);if(url.length<230000)break;q=Math.max(.45,q-.1);m=Math.round(m*.85)}res({url,w,h})};im.onerror=()=>{toast('Impossibile leggere questa foto');res(null)};im.src=rd.result};rd.readAsDataURL(f)};inp.click()})}
function squareCrop(img,size){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);res(c.toDataURL('image/jpeg',.82))};im.src=img.url})}

/* inbox / chat */
function visibleChats(){if(!S.acc)return[];return S.chats.filter(c=>!S.teen||isFollow(c.u)).sort((a,b)=>b.msgs[b.msgs.length-1].time-a.msgs[a.msgs.length-1].time)}
function renderInbox(){if(!S.acc)return;const L=visibleChats();const req=S.teen?0:S.chats.filter(c=>!isFollow(c.u)).length;
 $('#inboxScroll').innerHTML=`<div class="ptop"><b>Messaggi</b><button class="iconbtn" id="newMsg">${ic('plus',24)}</button></div>
 ${S.teen?`<div class="inote t">${ic('shield',17)}<span>Account Teen: solo le persone che segui possono scriverti, e i messaggi offensivi vengono bloccati.</span></div>`:`<div class="inote">${ic('shield',17)}<span>Puoi bloccare o segnalare chiunque dal suo profilo.${req?' Alcune chat sono di persone che non segui.':''}</span></div>`}
 <div class="ilist">${L.length?L.map(c=>{const p=USERS[c.u],m=c.msgs[c.msgs.length-1];return`<button class="it ${c.unread?'unread':''}" data-a="chat" data-u="${c.u}">${avHTML(p,52)}<div><b>${esc(p.n)}</b><span>${m.me?'Tu: ':''}${esc(m.t)} · ${ago(m.time)}</span></div>${c.unread?'<i class="udot"></i>':''}</button>`}).join(''):'<div class="emptyc">Nessuna chat. Segui qualcuno per iniziare!</div>'}</div>`;
 $('#newMsg').onclick=()=>{const opts=PEOPLE.filter(p=>!S.teen||isFollow(p.id));const ov=openSheet(`<div class="shead">Nuovo messaggio</div><div class="sbody">${opts.map(p=>`<div class="urow" data-u="${p.id}">${avHTML(p,44)}<div><b>${esc(p.n)}${p.v?VT:''}</b><span>@${esc(p.u)}</span></div></div>`).join('')}</div>`);$$('.urow',ov).forEach(r=>r.onclick=()=>{closeOv(ov);openChat(+r.dataset.u)})};
 updateBadges()}
function chatOf(u){let c=S.chats.find(c=>c.u===u);if(!c){c={u,msgs:[],unread:false};S.chats.push(c)}return c}
function addMsg(u,t,me){const c=chatOf(u);c.msgs.push({me,t,time:Date.now()});if(me){S.typing[u]=true;setTimeout(()=>{S.typing[u]=false;c.msgs.push({me:false,t:pick(REPLIES),time:Date.now()});const open=$('#chatv-'+u);if(open)drawChat(u);else{c.unread=true;toast(USERS[u].first+' ti ha risposto',USERS[u])}renderInbox()},1600+R()*2200)}renderInbox()}
function drawChat(u){const c=chatOf(u),box=$('#chatv-'+u);if(!box)return;c.unread=false;let h='',lt=0;c.msgs.forEach(m=>{if(m.time-lt>3600000)h+=`<div class="mtime">${ago(m.time)}</div>`;lt=m.time;h+=`<div class="bub ${m.me?'me':'them'}">${esc(m.t)}</div>`});if(S.typing[u])h+='<div class="bub them typing"><i></i><i></i><i></i></div>';box.innerHTML=h;box.scrollTop=box.scrollHeight;updateBadges()}
function openChat(u){if(S.teen&&!isFollow(u))return toast('Account Teen: puoi scrivere solo a chi segui');const p=USERS[u];
 const ov=openFull(`<div class="fhead"><button class="iconbtn" data-a="close">${ic('back')}</button><div class="dauth" data-a="user" data-u="${u}">${avHTML(p,36)}<div><b>${esc(p.n)}${p.v?VT:''}</b><small>@${esc(p.u)}</small></div></div></div>
 <div class="msgs" id="chatv-${u}"></div><div id="mw"></div><div class="cbar"><input id="mi" maxlength="500" placeholder="Messaggio…"><button class="send" id="ms">${ic('send',19,2)}</button></div>`);
 drawChat(u);renderInbox();
 const send=()=>{const v=$('#mi',ov).value.trim();if(!v)return;if(S.acc.settings.filter&&isBad(v)){$('#mw',ov).innerHTML='<div class="cwarn">Messaggio non inviato: sembra offensivo.</div>';return}$('#mw',ov).innerHTML='';$('#mi',ov).value='';addMsg(u,v,true);drawChat(u);setTimeout(()=>drawChat(u),900)};
 $('#ms',ov).onclick=send;$('#mi',ov).onkeydown=e=>{if(e.key==='Enter')send()};
 const iv=setInterval(()=>{if(!ov.isConnected)return clearInterval(iv);drawChat(u)},1000);ov.onclose=()=>{clearInterval(iv);renderInbox()}}

function openNotifs(){const a=S.acc;const ov=openSheet(`<div class="shead">Notifiche</div><div class="sbody" id="nl"></div>`);$('.sheet',ov).style.height='80%';
 const draw=()=>{$('#nl',ov).innerHTML=a.notifs.length?a.notifs.map((n,i)=>{const w=USERS[n.u],p=n.pid?getPost(n.pid):null;

  $$('[data-ok]',ov).forEach(b=>b.onclick=()=>{const n=a.notifs[+b.dataset.ok];n.done=true;n.type='follow';n.text='ha iniziato a seguirti';if(isR(n.u))Real.accept(n.u);else addFollower(n.u);draw();renderProfile()});
  $$('[data-no]',ov).forEach(b=>b.onclick=()=>{a.notifs.splice(+b.dataset.no,1);save();draw()})};
 draw();ov.onclose=()=>{a.notifs.forEach(n=>n.read=true);save();updateBadges()}}

/* simulated community activity */
function notify(type,who,post,text){const a=S.acc;a.notifs.unshift({type,u:who.id,pid:post?post.id:null,text,time:Date.now(),read:false});if(a.notifs.length>60)a.notifs.length=60;save();updateBadges();toast(`${who.first} ${text}`,who)}
function simTick(){try{const a=S.acc;if(!a||$('#main').classList.contains('hidden')||S.locked)return;
 const who=pick(PEOPLE),r=R(),own=a.own;
 if(own.length&&r<.38){const p=pick(own);p.likes++;notify('like',who,p,'ha messo mi piace al tuo post');$$(`[data-a="like"][data-id="${p.id}"] .n`).forEach(e=>e.textContent=likesTxt(p))}
 else if(own.length&&r<.6){const p=pick(own),t=pick(COMMENTS);p.cm.push({a:who.id,t,time:Date.now(),likes:0});p.cmCount++;notify('comment',who,p,`ha commentato: “${t}”`)}
 else if(r<.75){const fw=pick(USERS);if((a.followerIds||[]).includes(fw.id)){}else if(a.settings.private)notify('req',fw,null,'ha chiesto di seguirti');else{addFollower(fw.id);notify('follow',fw,null,'ha iniziato a seguirti');renderProfile()}}
 else if(r<.9){const L=S.teen?S.chats.filter(c=>isFollow(c.u)):S.chats;if(L.length){const c=pick(L);if(!$('#chatv-'+c.u)){c.msgs.push({me:false,t:pick(REPLIES.concat(STARTERS)),time:Date.now()});c.unread=true;toast(USERS[c.u].first+' ti ha scritto',USERS[c.u]);renderInbox()}}}
 else if(myStories().length){a.storyViews=(a.storyViews||0)+rint(1,4);notify('story',who,null,'ha visto la tua storia')}
 }finally{schedule()}}
function schedule(){clearTimeout(S.simT);S.simT=setTimeout(simTick,11000+R()*10000)}

/* lock & wellbeing */
function watchdog(){if(!S.acc||$('#main').classList.contains('hidden')||S.locked)return;const s=S.acc.settings;
 if(s.autolock&&Date.now()-S.last>180000)lockScreen();
 if(s.timeLimit&&!S.reminded&&Date.now()-S.startTs>s.timeLimit*60000){S.reminded=true;const ov=openSheet(`<div style="padding:10px 22px 24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center"><div class="donec" style="margin:6px auto;width:84px;height:84px;opacity:1;transform:none">${ic('clock',40,1.8)}</div><h3 style="font-size:21px">È ora di una pausa?</h3><p class="sub" style="margin:0">Sei su Vybe da ${s.timeLimit} minuti. Alzati, bevi un po’ d’acqua, guarda fuori dalla finestra 🌿</p><button class="btn" id="bk">Faccio una pausa</button><button class="btn soft" id="ct">Ancora 10 minuti</button></div>`);
  $('#bk',ov).onclick=()=>{closeAll();lockScreen()};$('#ct',ov).onclick=()=>{closeOv(ov);S.reminded=false;S.startTs=Date.now()-(s.timeLimit-10)*60000}}}
function lockScreen(){if(S.locked||!S.acc)return;S.locked=true;const acc=S.acc;let fails=0;const el=document.createElement('div');el.className='lockscreen';
 el.innerHTML=`${avHTML(ME(),80)}<h2>Ciao ${esc(acc.name.split(' ')[0])}</h2><p>Vybe è bloccata. Inserisci il PIN.</p>${keypadHTML()}<div class="spacer" style="flex:1"></div><button class="link" id="lkOut" style="color:var(--muted);font-weight:500">Non sei tu? Esci</button>`;
 $('#app').appendChild(el);mountSpace(el,'grid',{cy:.13,zoom:.55,dim:.7});
 bindKeypad(el,async(v,k)=>{if((await hash(acc.salt+'|pin|'+v))===acc.pinHash){el.remove();S.locked=false;S.last=Date.now();store.sset('vybe_ses','1')}else{fails++;if(fails>=5){el.remove();S.locked=false;S.acc.loggedIn=false;save();closeAll();toast('Troppi PIN errati: accedi di nuovo');showLogin()}else{k.msg(`PIN errato. Tentativi rimasti: ${5-fails}`,'err');k.clear(true)}}});
 $('#lkOut',el).onclick=()=>{el.remove();S.locked=false;S.acc.loggedIn=false;save();closeAll();showLogin()}}

/* ---------- Spotlight: distribuzione equa + anti-spam ---------- */
const STAGES=[{n:'Test',t:60},{n:'Pubblico vicino',t:400},{n:'Spotlight',t:3000},{n:'Tendenza',t:20000},{n:'Virale',t:120000}];
const THR=[.04,.055,.07,.09];
function qualityOf(p){let q=.45;const c=p.caption||'';if(p.type==='video')q+=.15;if(p.type==='photo')q+=.08;if(c.length>20)q+=.08;const nt=(p.tags||[]).length;if(nt>=1&&nt<=6)q+=.08;if(nt>10)q-=.25;if(/(.)\1{5,}/.test(c))q-=.1;const up=(c.match(/[A-Z]/g)||[]).length;if(c.length>12&&up>c.length*.6)q-=.1;return Math.max(.2,Math.min(.95,q))}
function newSpot(p){return{stage:0,q:qualityOf(p),luck:+(.55+R()*.8).toFixed(2),flag:null,done:false}}
function spamCheck(p){const a=S.acc,r=[];if((p.tags||[]).length>10)r.push('Troppi hashtag');
 if(p.caption&&p.caption.length>3&&a.own.some(o=>o!==p&&o.caption===p.caption&&Math.abs(o.time-p.time)<86400000))r.push('Didascalia duplicata');
 if(a.own.filter(o=>Math.abs(o.time-p.time)<3600000).length>5)r.push('Troppi post in poco tempo');
 if(p.views>200&&p.likes/p.views>.6)r.push('Interazioni anomale');return r}
function spotTick(p){if(!p.spot)p.spot=newSpot(p);if(p.views==null)p.views=0;p.shares=p.shares||0;p.saves=p.saves||0;p.watch=p.watch||0;if(!p.tags)p.tags=tagsOf(p.caption);
 const sp=p.spot;if(sp.flag||sp.done)return;const st=STAGES[sp.stage];
 if(p.views<st.t){const inc=Math.max(1,Math.round(st.t*(.04+R()*.08)*(vplusActive()?1.25:1))),q=sp.q;p.views+=inc;track('v',inc);
  const L=Math.round(inc*(.025+.1*q)*(sp.luck||1)*(.6+R()*.8));p.likes+=L;track('l',L);
  const C=Math.round(inc*.006*q*R()*2);if(C){p.cmCount=(p.cmCount||0)+C;track('c',C)}
  const sh=Math.round(inc*.008*q*R());p.shares+=sh;track('s',sh);const sv=Math.round(inc*.012*q*R());p.saves+=sv;track('sv',sv);
  const w=Math.round(inc*(p.type==='video'?Math.min(p.dur||10,30)*(.35+.5*q):3+4*q));p.watch+=w;track('w',w);
  if(R()<Math.min(.95,inc*.008*q)){const nf=Math.max(1,Math.round(inc*.006*q));for(let i=0;i<nf;i++)addFollower(pick(USERS).id);track('f',nf)}}
 else{const r=spamCheck(p);if(r.length){sp.flag=r;notifySys('Spotlight in pausa su un tuo post: '+r[0]);return}
  if(sp.stage<STAGES.length-1&&erOf(p)>=THR[sp.stage]){sp.stage++;if(sp.stage>=2)notifySys(`Il tuo post è entrato in “${STAGES[sp.stage].n}” 🚀`)}else sp.done=true}}

function simTick(){try{const a=S.acc;if(!a||$('#main').classList.contains('hidden')||S.locked)return;
 a.own.slice(0,30).forEach(spotTick);
 if(S.age>=18&&R()<.05){const w=pick(USERS),tier=R()<.2?'dlx':'std';if(addChSub(w,tier,true))notify('sub',w,null,`si è abbonato al tuo canale ${SUB_TIERS[tier].e} ${SUB_TIERS[tier].n}`)}
 for(let k=0;k<rint(1,3);k++){const fw=pick(USERS);if(R()<.7&&!(a.followerIds||[]).includes(fw.id)&&!isBlocked(fw.id)&&!a.settings.private){addFollower(fw.id);track('f')}}
 if(a.own.length){const p=pick(a.own),nl=rint(2,12);p.likes=(p.likes||0)+nl;track('l',nl)}
 const who=pick(PEOPLE),r=R(),own=a.own;
 if(own.length&&r<.22){const p=pick(own);notify('like',who,p,'ha messo mi piace al tuo post')}
 else if(own.length&&r<.4){const p=pick(own),t=pick(COMMENTS);p.cm.push({a:who.id,t,time:Date.now(),likes:0});p.cmCount=(p.cmCount||0)+1;track('c');notify('comment',who,p,`ha commentato: “${t}”`)}
 else if(r<.55){const fw=pick(USERS);if(!(a.followerIds||[]).includes(fw.id)&&!isBlocked(fw.id)){if(a.settings.private)notify('req',fw,null,'ha chiesto di seguirti');else{addFollower(fw.id);track('f');notify('follow',fw,null,'ha iniziato a seguirti');renderProfile()}}}
 else if(r<.72){const L=chatList().filter(c=>!$('#conv-'+c.id));if(L.length){const c=pick(L),from=c.type==='group'?pick(c.members):c.u;c.msgs.push({me:false,from,t:pick(REPLIES.concat(STARTERS)),time:Date.now()});if(c.msgs.length>60)c.msgs.shift();c.unread=true;toast(USERS[from].first+(c.type==='group'?' in '+c.name:'')+' ti ha scritto',USERS[from]);renderInbox()}}
 else if(r<.86){const ms=myStories();if(ms.length){const f=pick(ms);f.viewers=f.viewers||[];const w=pick(USERS);if(!f.viewers.some(v=>(v.u!=null?v.u:v)===w.id)){const re=R()<.25?pick(['😍','🔥','😂','👏']):null;f.viewers.push({u:w.id,r:re});a.storyViews=(a.storyViews||0)+1;if(re)notify('story',w,null,'ha reagito alla tua storia '+re)}}}
 else collabTick();
 save()}catch(e){try{console.error(e)}catch(_){}}finally{schedule()}}

const LEGAL={"privacy": "<h1>Informativa sulla privacy di Vybe</h1>\n<p class=\"u\">Ultimo aggiornamento: 17 novembre 2026</p>\n<p>Vybe è un social network fatto solo di persone vere: niente bot, niente profili finti, niente pubblicità. Questa pagina spiega in modo semplice quali dati usiamo, perché e come puoi controllarli.</p>\n\n<h2>1. Chi gestisce i tuoi dati</h2>\n<p>Il titolare del trattamento è il gestore di Vybe. Per qualsiasi domanda sulla privacy o per esercitare i tuoi diritti scrivici dall’app: <b>Impostazioni → Segnala un problema</b>.</p>\n\n<h2>2. Quali dati raccogliamo</h2>\n<ul>\n<li><b>Account</b>: email, nome, nome utente, data di nascita e password. La password non viene mai salvata in chiaro: il tuo account viene cifrato sul telefono prima di essere salvato online.</li>\n<li><b>Profilo</b>: foto profilo, copertina, biografia, post, storie, persone che segui e che ti seguono, mi piace.</li>\n<li><b>Messaggi di Vybe Chat</b>: sono cifrati end-to-end. Possono leggerli solo le persone della conversazione: né Vybe né i nostri fornitori possono leggerli.</li>\n<li><b>Statistiche</b>: quante persone hanno visto i tuoi post e le tue storie e chi ha visto le tue storie (questo elenco lo vedi solo tu).</li>\n<li><b>Notifiche</b>: se le attivi, salviamo l’indirizzo tecnico del tuo dispositivo che serve per mandarti le notifiche.</li>\n<li><b>Segnalazioni</b>: quando segnali un contenuto o un problema salviamo la segnalazione per poterla controllare.</li>\n<li><b>Dati tecnici</b>: per sicurezza e per correggere errori il server registra informazioni tecniche (tipo di dispositivo, orario, errori). Questi registri vengono cancellati automaticamente dopo poco tempo.</li>\n<li><b>Face ID</b>: il riconoscimento del viso avviene solo sul tuo telefono. Vybe non riceve e non salva mai il tuo viso.</li>\n</ul>\n\n<h2>3. Perché usiamo i dati</h2>\n<ul>\n<li>per farti accedere e tenere al sicuro il tuo account;</li>\n<li>per mostrare il tuo profilo e i tuoi contenuti alle persone che possono vederli;</li>\n<li>per consegnare i messaggi e le notifiche;</li>\n<li>per mostrarti statistiche vere nel Creator Studio;</li>\n<li>per proteggere la community: controllare le segnalazioni e bloccare chi viola le regole.</li>\n</ul>\n<p>Non vendiamo i tuoi dati, non mostriamo pubblicità e non ti tracciamo su altre app o siti.</p>\n\n<h2>4. Chi può vedere cosa</h2>\n<ul>\n<li><b>Profilo pubblico</b>: nome, nome utente, foto, post e storie sono visibili alle persone su Vybe.</li>\n<li><b>Profilo privato</b>: post e storie li vedono solo le persone che hai approvato.</li>\n<li><b>Account Teen</b>: per chi ha meno di 18 anni il profilo è più protetto e si può chattare solo con chi vi seguite a vicenda.</li>\n<li><b>Vybe Chat</b>: solo tu e le persone della conversazione. Puoi scrivere in privato solo a chi vi seguite a vicenda.</li>\n</ul>\n\n<h2>5. Dove sono conservati i dati</h2>\n<p>Vybe usa questi fornitori, che trattano i dati solo per farci funzionare il servizio:</p>\n<ul>\n<li><b>Vercel</b> – hosting del sito e archivio dei profili e dei file;</li>\n<li><b>Upstash</b> – database per chat cifrate, notifiche e statistiche;</li>\n<li><b>Apple (iTunes)</b> – quando cerchi una canzone, la ricerca viene inviata ad Apple per avere l’anteprima di 30 secondi;</li>\n<li><b>GitHub</b> – contiene solo il codice dell’app, nessun dato degli utenti.</li>\n</ul>\n<p>Alcuni di questi fornitori possono conservare i dati fuori dall’Unione Europea, con le garanzie previste dal GDPR.</p>\n\n<h2>6. Per quanto tempo</h2>\n<ul>\n<li>account, profilo e messaggi: finché non elimini l’account;</li>\n<li>storie: 24 ore nel profilo (poi solo nel tuo archivio personale);</li>\n<li>chi ha visto post e storie: al massimo 90 giorni;</li>\n<li>accessi alla chat: al massimo 60 giorni.</li>\n</ul>\n\n<h2>7. Età minima</h2>\n<p>Vybe è per chi ha almeno 12 anni. In Italia, sotto i 14 anni serve il consenso di un genitore. Gli account dei minori sono Teen, con protezioni in più.</p>\n\n<h2>8. I tuoi diritti</h2>\n<p>Puoi vedere e correggere i tuoi dati dal profilo, scaricare un backup del tuo account e <b>eliminare l’account in qualsiasi momento</b> da <b>Impostazioni → Elimina account</b>: profilo, post, storie, chat, statistiche e notifiche vengono cancellati. Hai anche il diritto di chiedere informazioni, opporti al trattamento e fare reclamo al Garante per la protezione dei dati personali (garanteprivacy.it).</p>\n\n<h2>9. Modifiche</h2>\n<p>Se cambiamo questa informativa aggiorniamo la data in alto e, per cambiamenti importanti, ti avvisiamo nell’app.</p>", "termini": "<h1>Termini d’uso di Vybe</h1>\n<p class=\"u\">Ultimo aggiornamento: 17 novembre 2026</p>\n<p>Usando Vybe accetti questi termini. Leggili: sono brevi e scritti in modo semplice.</p>\n\n<h2>1. Chi può usare Vybe</h2>\n<p>Devi avere almeno 12 anni. Se hai meno di 14 anni ti serve il permesso di un genitore. Devi usare dati veri: su Vybe ci sono solo persone vere.</p>\n\n<h2>2. Il tuo account</h2>\n<p>Sei responsabile del tuo account e di quello che pubblichi. Tieni segreti password, PIN e codici. Se pensi che qualcuno sia entrato nel tuo account, cambia la password e segnalacelo.</p>\n\n<h2>3. Regole della community – tolleranza zero</h2>\n<p>Su Vybe non c’è spazio per contenuti offensivi o persone che fanno del male agli altri. È vietato pubblicare o mandare:</p>\n<ul>\n<li>bullismo, molestie, minacce o insulti;</li>\n<li>odio verso persone o gruppi (per origine, religione, genere, orientamento, disabilità…);</li>\n<li>nudità, contenuti sessuali o qualsiasi contenuto sessuale che riguardi minori;</li>\n<li>violenza, autolesionismo o contenuti pericolosi;</li>\n<li>spam, truffe, profili falsi o furti d’identità;</li>\n<li>foto o dati di altre persone senza il loro permesso;</li>\n<li>contenuti che violano i diritti d’autore o la legge.</li>\n</ul>\n<p>Chi viola queste regole può vedere i contenuti rimossi e l’account bloccato o eliminato, senza preavviso.</p>\n\n<h2>4. Segnalazioni e blocchi</h2>\n<p>Puoi bloccare chiunque e segnalare post e profili con i tre puntini (⋯). Controlliamo le segnalazioni entro 24 ore e, se il contenuto viola le regole, lo togliamo e blocchiamo l’account di chi l’ha pubblicato.</p>\n\n<h2>5. I tuoi contenuti</h2>\n<p>Quello che pubblichi resta tuo. Pubblicandolo ci dai il permesso di mostrarlo alle persone che possono vederlo su Vybe, solo per far funzionare il servizio. Se elimini un post o il tuo account, smettiamo di mostrarlo.</p>\n\n<h2>6. Negozio Vybe</h2>\n<p>Il Negozio è dimostrativo: in questa versione non ci sono pagamenti reali e nessun prodotto viene spedito davvero.</p>\n\n<h2>7. Il servizio</h2>\n<p>Facciamo del nostro meglio perché Vybe funzioni sempre, ma possono esserci interruzioni o errori. Possiamo cambiare o migliorare le funzioni dell’app. Nei limiti consentiti dalla legge, Vybe non è responsabile per i contenuti pubblicati dagli utenti.</p>\n\n<h2>8. Chiusura dell’account</h2>\n<p>Puoi eliminare il tuo account quando vuoi da Impostazioni → Elimina account. Possiamo chiudere gli account che violano questi termini.</p>\n\n<h2>9. Legge applicabile</h2>\n<p>Questi termini sono regolati dalla legge italiana. Restano validi i diritti che la legge ti riconosce come consumatore.</p>\n\n<h2>10. Contatti</h2>\n<p>Per domande o problemi: <b>Impostazioni → Segnala un problema</b> nell’app.</p>"};

 else{try{if(Real.wipe)await Real.wipe()}catch(e){}}

 try{Object.keys(localStorage).filter(k=>/^vybe/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}try{sessionStorage.clear()}catch(e){}
